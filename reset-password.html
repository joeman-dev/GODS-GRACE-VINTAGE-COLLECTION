```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GG Vintage | Reset Password</title>

    <link rel="stylesheet" href="admin.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js" defer></script>
    <script src="reset-password.js" defer></script>
</head>

<body>

    <main class="login-container">

        <div class="brand">
            <h1>GG <span>VINTAGE</span></h1>
            <p>GOD'S GRACE VINTAGE COLLECTION</p>
        </div>

        <section class="login-card">

            <div class="login-heading">
                <span class="gold-line"></span>
                <h2>Reset Password</h2>
                <p>Create a new administrator password.</p>
            </div>

            <form id="resetPasswordForm">

                <label for="newPassword">New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Enter new password"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Confirm new password"
                    required
                >

                <button type="submit" id="resetButton">
                    UPDATE PASSWORD
                </button>

                <p id="resetMessage" role="status"></p>

            </form>

            <a href="admin.html" class="back-link">
                ← Back to Administrator Login
            </a>

        </section>

    </main>

</body>
</html>
```
