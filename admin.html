<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GG Vintage | Admin Login</title>

    <link rel="stylesheet" href="admin.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js" defer></script>
    <script src="admin.js" defer></script>
  </head>

  <body>
    <main class="login-container">
      <div class="brand">
        <h1>GOD'S GRACE <span>VINTAGE</span></h1>
        <p>GOD'S GRACE VINTAGE COLLECTION</p>
      </div>

      <section class="login-card">
        <div class="login-heading">
          <span class="gold-line"></span>
          <h2>Administrator Login</h2>
          <p>Sign in to manage your store.</p>
        </div>

        <form id="adminLoginForm">
          <label for="adminEmail">Email Address</label>

          <input
            type="email"
            id="adminEmail"
            placeholder="Enter administrator email"
            autocomplete="username"
            required
          />

          <label for="adminPassword">Password</label>

          <input
            type="password"
            id="adminPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />

          <button type="submit" id="loginButton">SIGN IN</button>

          <button
            type="button"
            id="forgotPasswordButton"
            class="forgot-password"
          >
            Forgot Password?
          </button>

          <p id="loginMessage" role="status" aria-live="polite"></p>
        </form>

        <a href="index.html" class="back-link"> ← Back to Store </a>
      </section>

      <footer>© 2026 GOD'S GRACE VINTAGE COLLECTION</footer>
    </main>
  </body>
</html>
